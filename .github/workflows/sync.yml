name: 每日自动同步专属影视仓

on:
  schedule:
    # 每天 UTC 02:10（北京时间 10:10）
    - cron: '10 2 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/build.py'
      - 'box.json'
      - '.github/workflows/sync.yml'
      - 'filmstore4k/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tvbox-pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # keepalive 已挪到 job 最后（见文件末尾）：放在最前会在并发运行时
# 抢先生成提交、把后面的主提交顶成 rejected，反而拖垮 Pages 部署。

      # configure-pages 只读取站点元数据。注意：它的 enablement=true 需要
      # 非 GITHUB_TOKEN 的 PAT，对 GITHUB_TOKEN 必然失败，所以这里不启用它；
      # 站点启用由 deploy.py 用 PAT 调 POST /pages 完成，并在本地轮询
      # GET /pages 确认真实存在。此步骤失败不影响后续。
      - name: 读取 Pages 元数据
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: 读取配置
        id: cfg
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          c = json.load(open('box.json', encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k in ('user', 'repo', 'sub', 'pages', 'cdn'):
                  f.write('%s=%s\n' % (k, c.get(k, '')))
          PY

      - name: 构建聚合线路（filmstore4k，实测源存活）
        run: |
          node filmstore4k/build-fs4k.js

      - name: 生成配置（单次构建，双通道共用同一份结果）
        # BOX_OUT 指向仓库根：build.py 会同时产出
        #   <SUB>/            → jsDelivr 备用通道（提交回仓库）
        #   _site/<SUB>/      → Pages 主通道（上传部署）
        env:
          BOX_OUT: ${{ github.workspace }}
          BOX_SUB: ${{ steps.cfg.outputs.sub }}
          BOX_PAGES: ${{ steps.cfg.outputs.pages }}
          BOX_CDN: ${{ steps.cfg.outputs.cdn }}
        run: python scripts/build.py

      - name: 校验产物与自检结论
        shell: bash
        run: |
          set -e
          d="${{ steps.cfg.outputs.sub }}"
          # .nojekyll 是 0 字节标记文件，POSIX `test -s` 要求 size>0，
          # 对它必然返回假；只能用 -f 判断存在。
          test -f .nojekyll
          # 子仓数量随上游变化（现在只有 c1/c2），不能硬编码文件名，
          # 改为按 index.json 实际列出的仓逐个校验。
          python - <<'PY'
          import json, os, sys
          d = os.environ['D']
          idx = json.load(open(os.path.join(d, 'index.json'), encoding='utf-8'))
          names = [u['url'].rsplit('/', 1)[-1] for u in idx.get('urls', [])]
          names.append('status.json')
          missing = []
          for fn in names:
              for p in (os.path.join(d, fn), os.path.join('_site', d, fn)):
                  if not (os.path.isfile(p) and os.path.getsize(p) > 0):
                      missing.append(p)
          if not (os.path.isfile('index.json') or
                  os.path.isfile(os.path.join(d, 'index.json'))):
              missing.append('index.json')
          if missing:
              print('缺失产物:', missing); sys.exit(1)
          print('子仓文件齐全:', names)
          PY
          # .nojekyll 必须在 _site 顶层，否则 Pages 会用 Jekyll 处理站点
          test -f _site/.nojekyll
          python - <<'PY'
          import json, os, sys
          d = os.environ['D']
          s = json.load(open(os.path.join(d, 'status.json'), encoding='utf-8'))
          v = s['verify']
          print('自检:', json.dumps(v, ensure_ascii=False))
          print('问题:', json.dumps(s['issues'], ensure_ascii=False))
          if s.get('fatal'):
              print('本次构建所有上游均失败，中止发布'); sys.exit(1)
          if v.get('total_problems', 1) != 0:
              print('生成物存在相对路径/死链残留，中止发布'); sys.exit(1)
          if not s['summary'].get('sub_configs'):
              print('未生成任何子仓，中止发布'); sys.exit(1)
          PY
        env:
          D: ${{ steps.cfg.outputs.sub }}

      - name: 提交结果回仓库（jsDelivr 通道 + 保持仓库活跃）
        shell: bash
        run: |
          set -e
          git config user.name  "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%MZ > .last-sync
          git add .nojekyll .last-sync "${{ steps.cfg.outputs.sub }}"
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交。"
          else
            git commit -m "chore: sync $(date -u +%Y-%m-%dT%H:%MZ)"
            # 并发运行（schedule/dispatch/push 同时触发）时远端可能已有新提交，
            # 直接 push 会被 rejected (fetch first)，导致后面的 Pages 部署被跳过。
            # 先 rebase 到远端最新再推，最多重试 5 次。
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main || true
              if git push origin main; then
                echo "推送成功（第 $i 次）"; break
              fi
              if [ "$i" = "5" ]; then
                echo "推送连续失败，放弃（不影响 Pages 部署，Pages 用的是本地 _site）"
              else
                echo "第 $i 次推送被拒，3 秒后重试"; sleep 3
              fi
            done
          fi

      # jsDelivr 对 @main 分支 URL 有 12h CDN / 7d 浏览器缓存，
      # 每次提交后主动 purge 备用地址，让「每日更新」在备用通道也生效。
      # purge 失败不影响主流程（主地址是 GitHub Pages，10 分钟缓存）。
      - name: 刷新备用 jsDelivr 缓存
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          for f in index.json c1.json c2.json c3.json 4k.json; do
            curl -sS -m 15 -X POST \
              "https://purge.jsdelivr.net/gh/${{ steps.cfg.outputs.user }}/${{ steps.cfg.outputs.repo }}@main/${{ steps.cfg.outputs.sub }}/$f" \
              > /dev/null || true
          done
          echo "已请求刷新备用地址缓存"

      - name: 上传 Pages 站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # 默认会 exclude 隐藏文件，导致 _site/.nojekyll 进不了产物、
          # Pages 回退用 Jekyll 处理站点。必须显式包含。
          include-hidden-files: true

      - name: 发布到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # 放在最后：公开仓库 60 天无活动会停用定时任务。
      # 只有前面全部失败、没产生任何提交时才需要补一次 keepalive，
      # 避免它抢在主页部署前制造 push 冲突。
      - name: 保持仓库活跃（兜底）
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name  "tvbox-bot"
          git config user.email "tvbox-bot@users.noreply.github.com"
          date -u +%Y-%m-%dT%H:%M:%SZ > .last-sync
          git add .last-sync
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              git push origin main && break || sleep 3
            done
          fi
